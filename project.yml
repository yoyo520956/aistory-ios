name: AIStory
options:
  bundleIdPrefix: com.qingyao
  groupIdentifier: com.qingyao
  deploymentTarget:
    iOS: "16.0"

targets:
  AIStory:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "AIStory"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "20261023.01"
        CFBundleIdentifier: "com.qingyao.aistory"
        UILaunchScreen:
          UIColorName: "DSWSurface"
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
        UIBackgroundModes:
          - "fetch"
        NSCameraUsageDescription: "拍摄素材用于生成分镜图"
        NSPhotoLibraryUsageDescription: "导入图片作为分镜参考"
        NSMicrophoneUsageDescription: "录制旁白配音"
        NSPhotoLibraryAddUsageDescription: "保存生成的图片"
    settings:
      base:
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.aistory
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 20261023.02
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
