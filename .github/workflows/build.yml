name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Guard - project must include Swift sources
        run: |
          SWIFT_COUNT=$(grep -c '\.swift' AIStory.xcodeproj/project.pbxproj || true)
          echo "pbxproj swift refs: $SWIFT_COUNT"
          LOCAL_SWIFT=$(find Sources -name '*.swift' | wc -l | tr -d ' ')
          echo "local swift files: $LOCAL_SWIFT"
          if [ "$SWIFT_COUNT" -lt 10 ]; then
            echo "::error::Too few Swift references in pbxproj ($SWIFT_COUNT) - asset/source wiring is broken"
            exit 1
          fi

      - name: Build and Archive
        run: |
          set -o pipefail
          VERSION=$(grep MARKETING_VERSION project.yml | head -1 | awk '{print $2}' | tr -d '"')
          BUILD=$(grep CURRENT_PROJECT_VERSION project.yml | head -1 | awk '{print $2}' | tr -d '"')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

          xcodebuild archive \
            -project AIStory.xcodeproj \
            -scheme AIStory \
            -configuration Release \
            -archivePath "$PWD/build/AIStory.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log

          echo "=== Checking archive ==="
          ls -la build/AIStory.xcarchive/Products/Applications/ 2>/dev/null || echo "no archive products"

          APP_PATH=$(find build/AIStory.xcarchive -name "*.app" -maxdepth 4 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in xcarchive"
            grep -E "error:" build.log | head -30
            exit 1
          fi
          echo "App found: $APP_PATH"

          echo "=== Creating IPA via Payload zip ==="
          rm -rf build/Payload build/ipa
          mkdir -p build/Payload build/ipa
          cp -R "$APP_PATH" build/Payload/
          (cd build/Payload && zip -qry ../ipa/AIStory-unsigned.ipa .)
          rm -rf build/Payload

          mv build/ipa/AIStory-unsigned.ipa AIStory-unsigned.ipa
          ls -la AIStory-unsigned.ipa
          echo "=== IPA created ==="

      - name: Verify IPA content
        run: |
          unzip -l AIStory-unsigned.ipa | head -20
          SIZE=$(stat -f%z AIStory-unsigned.ipa)
          echo "IPA size: $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "::error::IPA suspiciously small ($SIZE bytes)"
            exit 1
          fi
          md5 AIStory-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStory-unsigned
          path: AIStory-unsigned.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2.0
          files: AIStory-unsigned.ipa
          name: "AI Story v1.2.0"
          body: |
            ## AI Story iOS v1.2.0

            AI 漫剧生成系统 —— 连接 [ai_story](https://github.com/xhongc/ai_story) 后端的 iOS 原生客户端。

            ### 功能
            - 🔐 登录 / 注册（JWT）
            - 📖 项目列表 / 创建 / 编辑 / 详情
            - 🎬 8 阶段流水线执行（文案精修→资产抽取→分镜→文生图→多宫格→运镜→图生视频→图片编辑）
            - 📡 SSE 实时进度流
            - 🖼 素材预览
            - 🎞 作品 / 分集管理
            - ⚙️ 模型配置（自配 API：LLM / 文生图 / 图生视频 / 图片编辑）
            - 🖥 服务器地址与认证配置

            ### 安装
            1. 用 Feather 签名安装（未签名 IPA）
            2. 登录页填入服务器地址（如 `http://192.168.1.100:8000`）与账号
            3. 登录 → 开始创作

            ### 服务端
            需自行运行 ai_story 的 Django 后端（`/api/v1/` 前缀）
